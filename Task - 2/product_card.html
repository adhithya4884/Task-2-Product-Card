<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="product-card">
        
        <div class="image-container">
            <img class="product-image" src="https://placehold.co/600x400/1e293b/ffffff?text=Smart+Watch" alt="A modern, stylish smartwatch">
            <div class="sale-badge">SALE</div>
        </div>
        
        <div class="product-details">
            <h2 class="product-title">ChronoSmart Watch</h2>
            <p class="product-description">The next generation of wearable tech. Track your fitness and stay connected.</p>
            
            <div class="price-container">
                <span class="current-price">₹7,999</span>
                <span class="original-price">₹12,999</span>
            </div>

            <button class="add-to-cart-btn">
                Add to Cart
            </button>
        </div>
        
    </div>

</body>
</html>
